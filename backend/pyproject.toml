[tool.poetry]
name = "xrider-backend"
version = "0.1.0"
description = "XRider Motor Aggregator - FastAPI Backend"
authors = ["XRider Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.13.0"
asyncpg = "^0.29.0"          # async PostgreSQL driver
psycopg2-binary = "^2.9.9"   # sync driver (Alembic için)
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
redis = {extras = ["hiredis"], version = "^5.0.0"}
httpx = "^0.27.0"             # async HTTP client (feed indirme)
meilisearch = "^0.31.0"
lxml = "^5.2.0"               # XML parsing
rapidfuzz = "^3.9.0"          # fuzzy matching
python-slugify = "^8.0.0"
Pillow = "^10.3.0"            # görsel işleme
python-multipart = "^0.0.9"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}
tenacity = "^8.3.0"           # retry logic
structlog = "^24.2.0"         # structured logging

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
factory-boy = "^3.3.0"
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
