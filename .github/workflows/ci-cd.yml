name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xrider_test
          POSTGRES_USER: xrider
          POSTGRES_PASSWORD: xrider_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Python kurulum
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poetry kurulum
        run: pip install poetry==1.8.3

      - name: Bağımlılık kurulumu
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check app tests

      - name: DB migration uygula
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://xrider:xrider_test_pass@localhost:5432/xrider_test
        run: poetry run alembic upgrade head

      - name: Testleri çalıştır
        env:
          DATABASE_URL: postgresql+asyncpg://xrider:xrider_test_pass@localhost:5432/xrider_test
          DATABASE_URL_SYNC: postgresql+psycopg2://xrider:xrider_test_pass@localhost:5432/xrider_test
          REDIS_URL: redis://localhost:6379/0
          MEILISEARCH_URL: http://localhost:7700
          ENVIRONMENT: test
        run: poetry run pytest --cov=app --cov-report=xml -v

  # ── Frontend Build ─────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kurulum
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılık kurulumu
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.xrider.com.tr

  # ── Deploy Backend to Render ───────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Render)
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Render Deploy Hook
        run: |
          curl -s "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" \
            -X POST \
            -H "Content-Type: application/json"

  # ── Deploy Frontend to Vercel ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Vercel Deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--prod"
